  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 2500px;
    height: 1686px;
    overflow: hidden;
    font-family: 'Prompt', sans-serif;
    background: #020617;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ========================================================
     TOP AREA A: 2500 x 843 px (CHECK-IN)
     ======================================================== */
  .area-a {
    width: 2500px;
    height: 843px;
    position: relative;
    background: linear-gradient(135deg, #021a36 0%, #03437a 40%, #0284c7 100%);
    border-bottom: 6px solid #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 140px;
    overflow: hidden;
  }

  .glow-a-right {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    width: 850px;
    height: 850px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(2, 132, 199, 0.15) 55%, transparent 75%);
    pointer-events: none;
  }

  .glow-a-left {
    position: absolute;
    left: -100px;
    top: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .a-content {
    position: relative;
    z-index: 10;
    max-width: 1550px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .a-badge {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 3px solid rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(14px);
    padding: 14px 40px;
    border-radius: 9999px;
    font-size: 36px;
    font-weight: 700;
    color: #e0f2fe;
    letter-spacing: 2px;
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  .dot-pulse {
    width: 18px;
    height: 18px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 16px #38bdf8;
  }

  .a-title {
    font-size: 185px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: -2px;
    text-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    margin-bottom: 18px;
  }

  .a-sub {
    font-size: 56px;
    font-weight: 700;
    color: #bae6fd;
    line-height: 1.35;
    margin-bottom: 34px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  .a-touch {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    background: rgba(255, 255, 255, 0.25);
    border: 3px solid rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(16px);
    padding: 16px 48px;
    border-radius: 9999px;
    font-size: 42px;
    font-weight: 700;
    color: #ffffff;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
  }

  .a-touch svg {
    width: 38px;
    height: 38px;
    stroke: #ffffff;
    stroke-width: 3.5;
    fill: none;
  }

  .a-art-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .art-circle {
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
    border: 5px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(24px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 35px 80px rgba(0, 0, 0, 0.45);
  }


  /* ========================================================
     BOTTOM ROW: 2 EQUAL BLOCKS (1250 x 843 px)
     ======================================================== */
  .bottom-row {
    width: 2500px;
    height: 843px;
    display: flex;
  }

  /* AREA B: Bottom-Left (1250 x 843 px) */
  .area-b {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(145deg, #022c1e 0%, #065f46 50%, #059669 100%);
    border-right: 6px solid #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    text-align: center;
    overflow: hidden;
  }

  .glow-b {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 850px;
    height: 850px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  /* AREA C: Bottom-Right (1250 x 843 px) */
  .area-c {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(145deg, #150f38 0%, #3730a3 50%, #4f46e5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    text-align: center;
    overflow: hidden;
  }

  .glow-c {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 850px;
    height: 850px;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  .bot-inner {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .bot-icon-plate {
    width: 250px;
    height: 250px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bot-title {
    font-size: 135px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.15;
    letter-spacing: -1.5px;
    text-shadow: 0 10px 32px rgba(0, 0, 0, 0.6);
    margin-bottom: 14px;
  }

  .bot-sub {
    font-size: 52px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 28px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  .sub-emerald {
    color: #a7f3d0;
  }

  .sub-violet {
    color: #c7d2fe;
  }

  .bot-touch {
    display: inline-flex;
    align-items: center;
    gap: 16px;

  }

  .bot-touch svg {

    stroke: #ffffff;
    stroke-width: 3.5;
    fill: none;
  }

</style>
