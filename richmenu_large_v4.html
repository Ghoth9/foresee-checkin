<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Kanit';
    src: url('Kanit-Black.ttf') format('truetype');
    font-weight: 900;
  }
  @font-face {
    font-family: 'Kanit';
    src: url('Kanit-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Kanit';
    src: url('Kanit-Medium.ttf') format('truetype');
    font-weight: 500;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 2500px;
    height: 1686px;
    overflow: hidden;
    font-family: 'Kanit', sans-serif;
    background: #070b14;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================
     TOP AREA: A (2500 x 843 px) - ELECTRIC BLUE
     ========================================= */
  .area-top {
    width: 2500px;
    height: 843px;
    position: relative;
    background: linear-gradient(135deg, #031e3d 0%, #063c78 45%, #0284c7 100%);
    border-bottom: 6px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 130px;
    overflow: hidden;
  }

  /* Glow lighting */
  .top-glow-1 {
    position: absolute;
    right: 150px;
    top: 50%;
    transform: translateY(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(2, 132, 199, 0.15) 50%, transparent 75%);
    pointer-events: none;
  }

  .top-glow-2 {
    position: absolute;
    left: -100px;
    top: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .top-text {
    position: relative;
    z-index: 10;
    max-width: 1550px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 3px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(16px);
    padding: 12px 36px;
    border-radius: 9999px;
    font-size: 34px;
    font-weight: 700;
    color: #e0f2fe;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  .pulse-dot-blue {
    width: 20px;
    height: 20px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 16px #38bdf8;
  }

  .top-title {
    font-size: 170px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.08;
    letter-spacing: -2px;
    text-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    margin-bottom: 18px;
  }

  .top-desc {
    font-size: 54px;
    font-weight: 500;
    color: #bae6fd;
    line-height: 1.35;
    margin-bottom: 34px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  .btn-top {
    display: inline-flex;
    align-items: center;
    gap: 22px;
    background: #ffffff;
    color: #0369a1;
    font-size: 48px;
    font-weight: 900;
    padding: 22px 64px;
    border-radius: 30px;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.45);
    border: 3px solid rgba(255, 255, 255, 0.9);
  }

  .btn-top svg {
    width: 46px;
    height: 46px;
    stroke: #0369a1;
    stroke-width: 4;
    fill: none;
  }

  .top-art {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }


  /* =========================================
     BOTTOM ROW: 2 EQUAL BLOCKS (1250 x 843 px)
     ========================================= */
  .bottom-row {
    width: 2500px;
    height: 843px;
    display: flex;
  }

  /* AREA B: Bottom-Left (1250 x 843 px) - EMERALD */
  .card-left {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(140deg, #042e20 0%, #065f46 50%, #059669 100%);
    border-right: 6px solid #1e293b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    text-align: center;
    overflow: hidden;
  }

  .glow-left {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 850px;
    height: 850px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  /* AREA C: Bottom-Right (1250 x 843 px) - ROYAL INDIGO */
  .card-right {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(140deg, #181242 0%, #3730a3 50%, #6366f1 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    text-align: center;
    overflow: hidden;
  }

  .glow-right {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 850px;
    height: 850px;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  .bot-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .icon-wrapper-bot {
    width: 250px;
    height: 250px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bot-title {
    font-size: 130px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.15;
    letter-spacing: -1.5px;
    text-shadow: 0 10px 32px rgba(0, 0, 0, 0.6);
    margin-bottom: 14px;
  }

  .bot-desc {
    font-size: 50px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 30px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  .desc-green {
    color: #a7f3d0;
  }

  .desc-indigo {
    color: #c7d2fe;
  }

  .btn-bot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 100%;
    max-width: 620px;
    padding: 22px 48px;
    border-radius: 28px;
    font-size: 48px;
    font-weight: 900;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    background: #ffffff;
  }

  .btn-green {
    color: #065f46;
    border: 3px solid rgba(255, 255, 255, 0.95);
  }

  .btn-indigo {
    color: #312e81;
    border: 3px solid rgba(255, 255, 255, 0.95);
  }

  .btn-bot svg {
    width: 44px;
    height: 44px;
    stroke-width: 4;
    fill: none;
  }
  .btn-green svg { stroke: #065f46; }
  .btn-indigo svg { stroke: #312e81; }

</style>
</head>
<body>

  <!-- =========================================
       AREA A: บนเต็มจอ (2500 x 843 px)
       ========================================= -->
  <div class="area-top">
    <div class="top-glow-1"></div>
    <div class="top-glow-2"></div>

    <div class="top-text">
      <div class="pill-badge">
        <span class="pulse-dot-blue"></span>
        <span>ฟังก์ชันหลักประจำวัน • FORESEE</span>
      </div>
      <div class="top-title">เช็กอินหน้างาน</div>
      <div class="top-desc">บันทึกเวลาเข้างาน • พิกัด GPS แม่นยำ • ถ่ายรูปยืนยัน</div>
      <div class="btn-top">
        <span>กดเพื่อเริ่มเช็กอิน</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </div>

    <div class="top-art">
      <!-- 3D GPS Pin Illustration with Ripple Rays -->
      <svg width="480" height="480" viewBox="0 0 300 300">
        <defs>
          <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="45%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </linearGradient>
          <linearGradient id="pinGleam" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow3d" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
          </filter>
        </defs>

        <!-- Outer Radar Rings -->
        <circle cx="150" cy="140" r="130" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-dasharray="12 12"/>
        <circle cx="150" cy="140" r="105" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>

        <!-- The 3D Pin -->
        <g filter="url(#glow3d)">
          <path d="M150 25 C100 25 60 65 60 115 C60 172 150 260 150 260 C150 260 240 172 240 115 C240 65 200 25 150 25 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="6"/>
          <!-- Shine overlay -->
          <path d="M150 30 C105 30 70 65 70 110 C70 155 130 225 150 245 C150 245 150 30 150 30 Z" fill="url(#pinGleam)"/>
          <!-- White Center Disc -->
          <circle cx="150" cy="112" r="38" fill="#ffffff" filter="url(#glow3d)"/>
          <!-- Inner Core -->
          <circle cx="150" cy="112" r="22" fill="#0284c7"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- =========================================
       BOTTOM ROW: 2 บล็อก (1250 x 843 px each)
       ========================================= -->
  <div class="bottom-row">

    <!-- AREA B: ล่างซ้าย (1250 x 843 px) -->
    <div class="card-left">
      <div class="glow-left"></div>
      <div class="bot-content">
        <div class="icon-wrapper-bot">
          <!-- 3D Progress Growth & Verified Checkmark -->
          <svg width="240" height="240" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="barG1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#a7f3d0"/>
                <stop offset="100%" stop-color="#34d399"/>
              </linearGradient>
              <linearGradient id="barG2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#6ee7b7"/>
                <stop offset="100%" stop-color="#10b981"/>
              </linearGradient>
              <linearGradient id="barG3" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#34d399"/>
              </linearGradient>
              <filter id="botShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
              </filter>
            </defs>
            <!-- Frosted Disc -->
            <circle cx="100" cy="100" r="92" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
            <!-- Chart Bars -->
            <rect x="40" y="105" width="28" height="55" rx="14" fill="url(#barG1)" filter="url(#botShadow)"/>
            <rect x="85" y="75" width="28" height="85" rx="14" fill="url(#barG2)" filter="url(#botShadow)"/>
            <rect x="130" y="45" width="28" height="115" rx="14" fill="url(#barG3)" filter="url(#botShadow)"/>
            <!-- Large Floating Verified Check Button -->
            <circle cx="145" cy="138" r="38" fill="#ffffff" stroke="#10b981" stroke-width="4" filter="url(#botShadow)"/>
            <path d="M132 138 L142 148 L159 128" fill="none" stroke="#059669" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="bot-title">อัปเดต & ปิดงาน</div>
        <div class="bot-desc desc-green">ส่ง % คืบหน้า • แนบรูปถ่าย • เช็กเอาต์</div>
        <div class="btn-bot btn-green">
          <span>อัปเดตสถานะงาน</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

    <!-- AREA C: ล่างขวา (1250 x 843 px) -->
    <div class="card-right">
      <div class="glow-right"></div>
      <div class="bot-content">
        <div class="icon-wrapper-bot">
          <!-- 3D Task Dispatch Board -->
          <svg width="240" height="240" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="boardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#c7d2fe"/>
              </linearGradient>
              <linearGradient id="clipGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fde047"/>
                <stop offset="100%" stop-color="#eab308"/>
              </linearGradient>
            </defs>
            <!-- Frosted Disc -->
            <circle cx="100" cy="100" r="92" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
            <!-- Board Body -->
            <rect x="52" y="42" width="96" height="128" rx="20" fill="url(#boardGrad2)" filter="url(#botShadow)"/>
            <!-- Clip Header -->
            <rect x="74" y="28" width="52" height="28" rx="8" fill="url(#clipGrad2)" stroke="#ffffff" stroke-width="3"/>
            <!-- List Task Items -->
            <rect x="68" y="78" width="52" height="11" rx="5" fill="#4338ca"/>
            <rect x="68" y="104" width="58" height="11" rx="5" fill="#4338ca"/>
            <rect x="68" y="130" width="38" height="11" rx="5" fill="#4338ca"/>
            <!-- Floating Check Button -->
            <circle cx="145" cy="138" r="36" fill="#4f46e5" stroke="#ffffff" stroke-width="5" filter="url(#botShadow)"/>
            <path d="M134 138 L142 146 L157 129" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="bot-title">มอบหมายงาน</div>
        <div class="bot-desc desc-indigo">ดูรายการงาน • สั่งงานช่าง • ติดตามสด</div>
        <div class="btn-bot btn-indigo">
          <span>ดูรายการงาน</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
