<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Prompt';
    src: url('Prompt-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Prompt';
    src: url('Prompt-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Prompt';
    src: url('Prompt-Medium.ttf') format('truetype');
    font-weight: 500;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 2500px;
    height: 1686px;
    overflow: hidden;
    font-family: 'Prompt', sans-serif;
    background: #020617;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ========================================================
     AREA A: บนเต็มจอ (2500 x 843 px) - CHECK-IN
     ======================================================== */
  .area-a {
    width: 2500px;
    height: 843px;
    position: relative;
    background: linear-gradient(135deg, #021a36 0%, #03467d 40%, #0284c7 100%);
    border-bottom: 6px solid #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 130px;
    overflow: hidden;
  }

  /* Glow lighting */
  .glow-a-right {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(2, 132, 199, 0.15) 55%, transparent 75%);
    pointer-events: none;
  }

  .glow-a-left {
    position: absolute;
    left: -120px;
    top: -120px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.3) 0%, transparent 65%);
    pointer-events: none;
  }

  .a-left {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .a-badge {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(12px);
    padding: 14px 36px;
    border-radius: 9999px;
    font-size: 32px;
    font-weight: 600;
    color: #e0f2fe;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  .a-badge-dot {
    width: 16px;
    height: 16px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 12px #38bdf8;
  }

  .a-title {
    font-size: 150px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.15;
    letter-spacing: -1px;
    text-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    margin-bottom: 18px;
  }

  .a-subtitle {
    font-size: 48px;
    font-weight: 500;
    color: #bae6fd;
    line-height: 1.4;
    margin-bottom: 34px;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  .a-cta-tag {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    background: #ffffff;
    color: #0369a1;
    font-size: 42px;
    font-weight: 700;
    padding: 20px 52px;
    border-radius: 9999px;
    box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
  }

  .a-cta-tag svg {
    width: 40px;
    height: 40px;
    stroke: #0369a1;
    stroke-width: 3.5;
    fill: none;
  }

  /* Right 3D Art */
  .a-right-art {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .art-circle {
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 100%);
    border: 4px solid rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
  }

  .pin-icon-wrap {
    width: 330px;
    height: 330px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
    border: 4px solid rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 45px rgba(2, 132, 199, 0.55);
  }

  .pin-icon-wrap svg {
    width: 190px;
    height: 190px;
    stroke: #ffffff;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
  }


  /* ========================================================
     BOTTOM ROW: 2 ช่องเท่ากัน (1250 x 843 px each)
     ======================================================== */
  .bottom-row {
    width: 2500px;
    height: 843px;
    display: flex;
  }

  /* AREA B: ล่างซ้าย (1250 x 843 px) - EMERALD GREEN */
  .area-b {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(145deg, #022c1e 0%, #065f46 50%, #059669 100%);
    border-right: 6px solid #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 70px;
    text-align: center;
    overflow: hidden;
  }

  .glow-b {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 750px;
    height: 750px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  /* AREA C: ล่างขวา (1250 x 843 px) - ROYAL INDIGO */
  .area-c {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(145deg, #150f38 0%, #3730a3 50%, #4f46e5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 70px;
    text-align: center;
    overflow: hidden;
  }

  .glow-c {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 750px;
    height: 750px;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  .card-inner-bot {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .bot-icon-plate {
    width: 250px;
    height: 250px;
    border-radius: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
    border: 4px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(14px);
  }

  .plate-green {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(5, 150, 105, 0.5) 100%);
    box-shadow: 0 20px 45px rgba(5, 150, 105, 0.4);
  }

  .plate-indigo {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(79, 70, 229, 0.5) 100%);
    box-shadow: 0 20px 45px rgba(79, 70, 229, 0.4);
  }

  .bot-icon-plate svg {
    width: 145px;
    height: 145px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.3));
  }

  .bot-title {
    font-size: 115px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
    letter-spacing: -1px;
    text-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    margin-bottom: 14px;
  }

  .bot-sub {
    font-size: 46px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 30px;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  .sub-emerald {
    color: #a7f3d0;
  }

  .sub-violet {
    color: #c7d2fe;
  }

  .bot-pill {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: #ffffff;
    padding: 18px 48px;
    border-radius: 9999px;
    font-size: 40px;
    font-weight: 700;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  }

  .pill-green {
    color: #065f46;
  }

  .pill-indigo {
    color: #3730a3;
  }

  .bot-pill svg {
    width: 36px;
    height: 36px;
    stroke-width: 3.5;
    fill: none;
  }
  .pill-green svg { stroke: #065f46; }
  .pill-indigo svg { stroke: #3730a3; }

</style>
</head>
<body>

  <!-- =========================================
       AREA A: บนเต็มจอ (2500 x 843 px) - CHECK-IN
       ========================================= -->
  <div class="area-a">
    <div class="glow-a-right"></div>
    <div class="glow-a-left"></div>

    <div class="a-left">
      <div class="a-badge">
        <span class="a-badge-dot"></span>
        <span>ฟังก์ชันหลักประจำวัน • FORESEE</span>
      </div>
      <div class="a-title">เช็กอินหน้างาน</div>
      <div class="a-subtitle">บันทึกเวลาเข้างาน • ระบุพิกัด GPS • ถ่ายรูปยืนยัน</div>
      <div class="a-cta-tag">
        <span>แตะเพื่อเริ่มเช็กอิน</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </div>

    <div class="a-right-art">
      <div class="art-circle">
        <div class="pin-icon-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
            <circle cx="12" cy="10" r="3.2"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================
       BOTTOM ROW: 2 ช่องเท่ากัน (1250 x 843 px each)
       ========================================= -->
  <div class="bottom-row">

    <!-- AREA B: ล่างซ้าย (1250 x 843 px) -->
    <div class="area-b">
      <div class="glow-b"></div>
      <div class="card-inner-bot">
        <div class="bot-icon-plate plate-green">
          <svg viewBox="0 0 24 24">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
            <path d="m9 11 3 3L22 4" stroke-width="2.6"/>
          </svg>
        </div>
        <div class="bot-title">อัปเดต & ปิดงาน</div>
        <div class="bot-sub sub-emerald">ส่ง % ความคืบหน้า • แนบรูปถ่าย • เช็กเอาต์</div>
        <div class="bot-pill pill-green">
          <span>อัปเดตสถานะงาน</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

    <!-- AREA C: ล่างขวา (1250 x 843 px) -->
    <div class="area-c">
      <div class="glow-c"></div>
      <div class="card-inner-bot">
        <div class="bot-icon-plate plate-indigo">
          <svg viewBox="0 0 24 24">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="2"/>
            <path d="m9 14 2 2 4-4"/>
          </svg>
        </div>
        <div class="bot-title">มอบหมายงาน</div>
        <div class="bot-sub sub-violet">ดูรายการงาน • สั่งงานช่าง • ติดตามสด</div>
        <div class="bot-pill pill-indigo">
          <span>ดูรายการงาน</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
