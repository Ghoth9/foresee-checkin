<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 2500px;
    height: 1686px;
    overflow: hidden;
    font-family: 'Leelawadee UI', 'Segoe UI', -apple-system, sans-serif;
    background: #0b1120;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================
     TOP AREA: A (2500 x 843 px)
     ========================================= */
  .area-top {
    width: 2500px;
    height: 843px;
    position: relative;
    background: linear-gradient(120deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
    border-bottom: 6px solid #334155;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 140px;
    overflow: hidden;
  }

  /* Glow effects */
  .glow-top-1 {
    position: absolute;
    right: 200px;
    top: 50%;
    transform: translateY(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.4) 0%, transparent 70%);
    pointer-events: none;
  }

  .glow-top-2 {
    position: absolute;
    left: -100px;
    top: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.3) 0%, transparent 70%);
    pointer-events: none;
  }

  .top-content {
    position: relative;
    z-index: 10;
    max-width: 1550px;
  }

  .top-badge {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 3px solid rgba(255, 255, 255, 0.4);
    padding: 14px 38px;
    border-radius: 9999px;
    font-size: 36px;
    font-weight: 700;
    color: #f0f9ff;
    letter-spacing: 2px;
    margin-bottom: 28px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }

  .pulse-dot {
    width: 20px;
    height: 20px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 16px #38bdf8;
  }

  .top-title {
    font-size: 155px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: -2px;
    text-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 30px;
  }

  .top-desc {
    font-size: 52px;
    font-weight: 600;
    color: #bae6fd;
    line-height: 1.3;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  /* 3D-Style Illustrated Pin in Top Area */
  .top-art-wrap {
    position: relative;
    z-index: 10;
    width: 440px;
    height: 440px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pin-3d {
    width: 400px;
    height: 400px;
    filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.5));
  }


  /* =========================================
     BOTTOM ROW: B & C (1250 x 843 px each)
     ========================================= */
  .bottom-row {
    width: 2500px;
    height: 843px;
    display: flex;
  }

  /* AREA B: Bottom-Left (1250 x 843 px) */
  .area-bot-left {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(135deg, #059669 0%, #047857 50%, #064e3b 100%);
    border-right: 6px solid #334155;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    text-align: center;
    overflow: hidden;
  }

  .glow-bot-left {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(52, 211, 153, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  /* AREA C: Bottom-Right (1250 x 843 px) */
  .area-bot-right {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #312e81 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    text-align: center;
    overflow: hidden;
  }

  .glow-bot-right {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(165, 180, 252, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }

  .bot-inner {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .bot-icon-wrap {
    width: 250px;
    height: 250px;
    margin-bottom: 24px;
    filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.45));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bot-title {
    font-size: 112px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.15;
    letter-spacing: -1px;
    text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    margin-bottom: 16px;
  }

  .bot-sub {
    font-size: 48px;
    font-weight: 600;
    line-height: 1.3;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  .sub-green {
    color: #d1fae5;
  }

  .sub-purple {
    color: #e0e7ff;
  }

  /* Modern Glass Cards Container */
  .touch-pill {
    margin-top: 32px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: rgba(255, 255, 255, 0.22);
    border: 3px solid rgba(255, 255, 255, 0.5);
    padding: 16px 48px;
    border-radius: 9999px;
    font-size: 38px;
    font-weight: 800;
    color: #ffffff;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>

  <!-- =========================================
       AREA A: เช็กอินหน้างาน (2500 x 843 px)
       ========================================= -->
  <div class="area-top">
    <div class="glow-top-1"></div>
    <div class="glow-top-2"></div>

    <div class="top-content">
      <div class="top-badge">
        <span class="pulse-dot"></span>
        <span>ระบบบันทึกเวลา • FORESEE TECH</span>
      </div>
      <div class="top-title">
        <span>📍</span>
        <span>เช็กอินหน้างาน</span>
      </div>
      <div class="top-desc">บันทึกเวลาเข้างาน • ระบุพิกัด GPS • ถ่ายรูปยืนยัน</div>
      <div class="touch-pill">
        <span>แตะที่นี่เพื่อเช็กอิน</span>
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </div>
    </div>

    <div class="top-art-wrap">
      <!-- High-res 3D Pin SVG -->
      <svg class="pin-3d" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="pinBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </linearGradient>
          <radialGradient id="pinShine" cx="35%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="pinRing" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#bae6fd"/>
          </linearGradient>
          <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
          </filter>
        </defs>
        <!-- Outer circle glow -->
        <circle cx="100" cy="95" r="90" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
        <!-- Pin Shape -->
        <g filter="url(#shadow3d)">
          <path d="M100 20 C64 20 35 49 35 85 C35 125 100 178 100 178 C100 178 165 125 165 85 C165 49 136 20 100 20 Z" fill="url(#pinBody)" stroke="#ffffff" stroke-width="4"/>
          <path d="M100 20 C64 20 35 49 35 85 C35 125 100 178 100 178 C100 178 165 125 165 85 C165 49 136 20 100 20 Z" fill="url(#pinShine)"/>
          <!-- Inner circle hole -->
          <circle cx="100" cy="82" r="26" fill="#0f172a" stroke="url(#pinRing)" stroke-width="6"/>
          <circle cx="100" cy="82" r="14" fill="#38bdf8"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- =========================================
       BOTTOM ROW: 2 บล็อก (1250 x 843 px each)
       ========================================= -->
  <div class="bottom-row">

    <!-- AREA B: อัปเดต & ปิดงาน (1250 x 843 px) -->
    <div class="area-bot-left">
      <div class="glow-bot-left"></div>
      <div class="bot-inner">
        <div class="bot-icon-wrap">
          <!-- 3D Progress/Check SVG -->
          <svg width="240" height="240" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#a7f3d0"/>
                <stop offset="100%" stop-color="#34d399"/>
              </linearGradient>
              <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#6ee7b7"/>
                <stop offset="100%" stop-color="#10b981"/>
              </linearGradient>
              <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#34d399"/>
              </linearGradient>
              <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
              </filter>
            </defs>
            <!-- Background circular plate -->
            <circle cx="100" cy="100" r="90" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="4"/>
            <!-- Chart Bars -->
            <rect x="42" y="105" width="28" height="55" rx="14" fill="url(#barGrad1)" filter="url(#badgeShadow)"/>
            <rect x="86" y="75" width="28" height="85" rx="14" fill="url(#barGrad2)" filter="url(#badgeShadow)"/>
            <rect x="130" y="45" width="28" height="115" rx="14" fill="url(#barGrad3)" filter="url(#badgeShadow)"/>
            <!-- Floating Checkmark Circle Badge -->
            <circle cx="140" cy="135" r="34" fill="#ffffff" filter="url(#badgeShadow)"/>
            <path d="M128 135 L137 144 L153 126" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="bot-title">📊 อัปเดต & ปิดงาน</div>
        <div class="bot-sub sub-green">ส่ง % ความคืบหน้า • แนบรูปถ่าย • เช็กเอาต์</div>
        <div class="touch-pill">
          <span>แตะเพื่อรายงานผล</span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- AREA C: มอบหมายงาน (1250 x 843 px) -->
    <div class="area-bot-right">
      <div class="glow-bot-right"></div>
      <div class="bot-inner">
        <div class="bot-icon-wrap">
          <!-- 3D Tasks/Clipboard SVG -->
          <svg width="240" height="240" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#c7d2fe"/>
              </linearGradient>
              <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fbbf24"/>
                <stop offset="100%" stop-color="#d97706"/>
              </linearGradient>
            </defs>
            <!-- Background circular plate -->
            <circle cx="100" cy="100" r="90" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="4"/>
            <!-- Clipboard Body -->
            <rect x="50" y="45" width="100" height="125" rx="20" fill="url(#boardGrad)" filter="url(#badgeShadow)"/>
            <!-- Top Clip -->
            <rect x="75" y="32" width="50" height="26" rx="8" fill="url(#clipGrad)" stroke="#ffffff" stroke-width="3"/>
            <!-- Check Rows -->
            <rect x="70" y="80" width="55" height="10" rx="5" fill="#4338ca"/>
            <rect x="70" y="106" width="60" height="10" rx="5" fill="#4338ca"/>
            <rect x="70" y="132" width="40" height="10" rx="5" fill="#4338ca"/>
            <!-- Floating Checkmark Circle Badge -->
            <circle cx="145" cy="135" r="32" fill="#4f46e5" stroke="#ffffff" stroke-width="4" filter="url(#badgeShadow)"/>
            <path d="M135 135 L143 143 L157 127" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="bot-title">📋 มอบหมายงาน</div>
        <div class="bot-sub sub-purple">ดูรายการงาน • สั่งงานช่าง • ติดตามสด</div>
        <div class="touch-pill">
          <span>แตะเพื่อดูงานทั้งหมด</span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
