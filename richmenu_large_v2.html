<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Prompt:wght@600;700;800;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 2500px;
    height: 1686px;
    overflow: hidden;
    font-family: 'Kanit', 'Prompt', sans-serif;
    background: #0b0f19;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* =========================================
     TOP CARD: AREA A (2500 x 843)
     ========================================= */
  .card-top {
    width: 2500px;
    height: 843px;
    position: relative;
    background: linear-gradient(135deg, #091e3a 0%, #0d3868 40%, #0284c7 100%);
    border-bottom: 6px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 140px;
    overflow: hidden;
  }

  /* Decorative glowing background elements */
  .card-top::before {
    content: '';
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(14, 165, 233, 0.1) 60%, transparent 80%);
    border-radius: 50%;
    filter: blur(40px);
    pointer-events: none;
  }

  .card-top::after {
    content: '';
    position: absolute;
    left: -150px;
    top: -150px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(50px);
    pointer-events: none;
  }

  /* Top Left Typography */
  .top-text-box {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.18);
    border: 3px solid rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(16px);
    padding: 12px 34px;
    border-radius: 9999px;
    font-size: 32px;
    font-weight: 800;
    color: #e0f2fe;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }

  .tag-dot {
    width: 16px;
    height: 16px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 14px #38bdf8;
  }

  .top-heading {
    font-size: 130px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: -1.5px;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
    margin-bottom: 18px;
  }

  .top-subheading {
    font-size: 46px;
    font-weight: 600;
    color: #bae6fd;
    line-height: 1.35;
    margin-bottom: 38px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  .top-btn {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    background: #ffffff;
    color: #0369a1;
    font-size: 44px;
    font-weight: 900;
    padding: 24px 60px;
    border-radius: 28px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    border: 3px solid rgba(255, 255, 255, 0.9);
  }

  .top-btn svg {
    width: 44px;
    height: 44px;
    stroke: #0369a1;
    stroke-width: 4;
    fill: none;
  }

  /* Top Right 3D Icon Graphic */
  .top-graphic-box {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .top-icon-halo {
    width: 460px;
    height: 460px;
    border-radius: 120px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 100%);
    border: 5px solid rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(24px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 35px 80px rgba(0, 0, 0, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.5);
    transform: rotate(-3deg);
  }

  .top-icon-inner {
    width: 340px;
    height: 340px;
    border-radius: 90px;
    background: linear-gradient(135deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 50px rgba(2, 132, 199, 0.6);
  }

  .top-icon-inner svg {
    width: 210px;
    height: 210px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.35));
  }


  /* =========================================
     BOTTOM ROW: 2 EQUAL BLOCKS (1250 x 843 each)
     ========================================= */
  .bottom-row {
    width: 2500px;
    height: 843px;
    display: flex;
  }

  /* BOTTOM LEFT: AREA B (1250 x 843) - EMERALD GREEN */
  .card-bot-left {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(150deg, #053326 0%, #064e3b 45%, #059669 100%);
    border-right: 4px solid #1e293b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 70px;
    text-align: center;
    overflow: hidden;
  }

  .card-bot-left::before {
    content: '';
    position: absolute;
    top: -120px;
    left: -120px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(50px);
    pointer-events: none;
  }

  /* BOTTOM RIGHT: AREA C (1250 x 843) - ROYAL INDIGO */
  .card-bot-right {
    width: 1250px;
    height: 843px;
    position: relative;
    background: linear-gradient(150deg, #1b164a 0%, #312e81 45%, #4f46e5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 70px;
    text-align: center;
    overflow: hidden;
  }

  .card-bot-right::before {
    content: '';
    position: absolute;
    top: -120px;
    right: -120px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(50px);
    pointer-events: none;
  }

  .bot-content-wrap {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* Bottom Icon Containers */
  .bot-icon-halo {
    width: 250px;
    height: 250px;
    border-radius: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    backdrop-filter: blur(20px);
    border: 4px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
  }

  .halo-green {
    background: linear-gradient(135deg, rgba(52, 211, 153, 0.3) 0%, rgba(5, 150, 105, 0.6) 100%);
    box-shadow: 0 20px 50px rgba(5, 150, 105, 0.5);
  }

  .halo-indigo {
    background: linear-gradient(135deg, rgba(165, 180, 252, 0.3) 0%, rgba(79, 70, 229, 0.6) 100%);
    box-shadow: 0 20px 50px rgba(79, 70, 229, 0.5);
  }

  .bot-icon-halo svg {
    width: 135px;
    height: 135px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
  }

  /* Big Bottom Headings */
  .bot-heading {
    font-size: 96px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 12px;
    letter-spacing: -1px;
    text-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }

  .bot-subheading {
    font-size: 42px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 32px;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  .sub-green {
    color: #a7f3d0;
  }

  .sub-indigo {
    color: #c7d2fe;
  }

  /* Bottom Big Action Buttons */
  .bot-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 100%;
    max-width: 580px;
    padding: 24px 44px;
    border-radius: 28px;
    font-size: 44px;
    font-weight: 900;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    letter-spacing: 0.5px;
  }

  .btn-green {
    background: #ffffff;
    color: #065f46;
    border: 3px solid rgba(255, 255, 255, 0.9);
  }

  .btn-indigo {
    background: #ffffff;
    color: #3730a3;
    border: 3px solid rgba(255, 255, 255, 0.9);
  }

  .bot-btn svg {
    width: 40px;
    height: 40px;
    stroke-width: 4;
    fill: none;
  }
  .btn-green svg { stroke: #065f46; }
  .btn-indigo svg { stroke: #3730a3; }

</style>
</head>
<body>

  <!-- =========================================
       AREA A: บนเต็มจอ (2500 x 843 px)
       ========================================= -->
  <div class="card-top">
    <div class="top-text-box">
      <div class="tag-pill">
        <span class="tag-dot"></span>
        <span>ฟังก์ชันหลักประจำวัน</span>
      </div>
      <div class="top-heading">📍 เช็กอินหน้างาน</div>
      <div class="top-subheading">บันทึกเวลาเข้างาน • ระบุพิกัด GPS • ถ่ายรูปยืนยัน</div>
      <div class="top-btn">
        <span>กดเพื่อเริ่มเช็กอิน</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </div>
    
    <div class="top-graphic-box">
      <div class="top-icon-halo">
        <div class="top-icon-inner">
          <svg viewBox="0 0 24 24">
            <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
            <circle cx="12" cy="10" r="3.2"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================
       BOTTOM ROW: 2 ช่องเท่ากัน (1250 x 843 px)
       ========================================= -->
  <div class="bottom-row">

    <!-- AREA B: ล่างซ้าย (1250 x 843 px) -->
    <div class="card-bot-left">
      <div class="bot-content-wrap">
        <div class="bot-icon-halo halo-green">
          <svg viewBox="0 0 24 24">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
            <path d="m9 11 3 3L22 4" stroke-width="2.6"/>
          </svg>
        </div>
        <div class="bot-heading">📊 อัปเดต & ปิดงาน</div>
        <div class="bot-subheading sub-green">ส่ง % คืบหน้า • แนบรูปถ่าย • เช็กเอาต์</div>
        <div class="bot-btn btn-green">
          <span>อัปเดตสถานะงาน</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

    <!-- AREA C: ล่างขวา (1250 x 843 px) -->
    <div class="card-bot-right">
      <div class="bot-content-wrap">
        <div class="bot-icon-halo halo-indigo">
          <svg viewBox="0 0 24 24">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="2"/>
            <path d="m9 14 2 2 4-4"/>
          </svg>
        </div>
        <div class="bot-heading">📋 มอบหมายงาน</div>
        <div class="bot-subheading sub-indigo">ดูรายการงาน • สั่งงานช่าง • ติดตามสด</div>
        <div class="bot-btn btn-indigo">
          <span>ดูรายการงาน</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
